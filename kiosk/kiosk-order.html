<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155b87"><title>Card lunch ordering</title><link rel="stylesheet" href="lunch.css"><script src="kiosk-order.js" defer></script></head><body class="kiosk-page"><div class="app-shell"><header class="app-header"><div class="admin-mark">ID</div><div class="header-title"><h1 id="employeeName">Lunch ordering</h1><span id="employeeNumber"></span></div><div class="kiosk-header-tools"><select id="kioskLanguage" class="language-select kiosk-language" aria-label="Language"><option value="en">EN</option><option value="sv">SV</option><option value="fi">FI</option></select><span id="timeoutCounter" class="timeout-counter" title="Automatic logout after inactivity">60 s</span></div><button class="save-link" id="logoutButton" type="button">Cancel</button></header><main><section class="poc-simulation"><label><input id="simulateFriday" type="checkbox"><span id="simulateFridayLabel">POC: Simulate Friday</span></label></section><section class="kiosk-mode-tabs"><button class="active" data-mode="own" type="button">My lunch</button><button data-mode="guest" type="button">Guest lunches</button></section><section class="kiosk-user-note" id="ownNote"><strong>Order your own lunch</strong><span>Select meals below, then save. The screen returns to card login automatically.</span></section><section class="task-panel kiosk-guest-field" id="guestField" hidden><label for="guestComment">Work task / project <span aria-hidden="true">*</span></label><input id="guestComment" maxlength="120" autocomplete="off" placeholder="Example: Project 1234, supplier visit"><small>Required for guest lunches. Comments are stored exactly as entered.</small></section><section class="week" id="kioskWeek" aria-label="Lunch menu"></section></main><div class="save-bar"><div><strong id="kioskSummary">No lunches selected</strong><span id="kioskStatus">Select a meal to continue</span></div><button id="kioskSave" type="button" disabled>Save and finish</button></div><div class="toast" id="toast"></div></div></body></html>
