<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155b87"><title>Order explorer</title><link rel="stylesheet" href="lunch.css"><script src="admin-i18n.js" defer></script><script src="order-data.js" defer></script><script src="order-explorer.js" defer></script></head><body><div class="app-shell admin-shell"><header class="app-header"><a class="back-button" href="index.html" aria-label="Back">‹</a><div class="header-title"><h1>Order explorer</h1><span>Who ordered what?</span></div><button class="save-link" id="printExplorer" type="button">Print</button></header><main>
<section class="explorer-toolbar"><div><label for="explorerWeek">Week</label><select id="explorerWeek"></select></div><div class="explorer-search"><label for="explorerSearch">Search</label><input id="explorerSearch" type="search" placeholder="Employee, number, meal or guest comment"></div><label class="demo-switch"><input id="explorerDemo" type="checkbox" checked><span>Include demo orders</span></label></section>
<section class="explorer-tabs"><button class="active" data-view="employee" type="button">By employee</button><button data-view="meal" type="button">By meal</button></section>
<section class="weekly-panel explorer-panel"><div class="panel-heading"><div><h2 id="explorerHeading">Orders by employee</h2><p id="explorerHelp">Select an employee to see daily details.</p></div></div><div id="explorerResults"></div></section>
<p class="poc-note">Search covers employee name, employee number, meal name and exact guest comment. Results include browser and kiosk orders.</p></main></div></body></html>
