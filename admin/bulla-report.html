<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulla report</title><link rel="stylesheet" href="lunch.css"><script src="admin-i18n.js" defer></script><script src="bulla-report.js" defer></script></head><body><div class="app-shell admin-shell"><header class="app-header"><a class="back-button" href="index.html">‹</a><div class="header-title"><h1>Bulla report</h1><span>Purchases by employee</span></div><button class="save-link" id="exportCsv">Export CSV</button></header><main><section class="bulla-period-tabs"><button class="active" data-period="week" type="button">Weekly</button><button data-period="month" type="button">Monthly</button></section><section class="weekly-toolbar bulla-history-toolbar"><div class="setting-field"><label for="historySelect">Period</label><select id="historySelect"></select></div><div class="setting-field"><label for="search">Search</label><input id="search" type="search" placeholder="Employee or product"></div></section><section class="summary-cards"><article><span>Purchases</span><strong id="purchaseCount">0</strong></article><article><span>Products</span><strong id="productCount">0</strong></article><article><span>Total</span><strong id="grandTotal">€0.00</strong></article></section><section class="weekly-panel"><div class="panel-heading"><div><h2>Employee purchases</h2><p>Click an employee to show individual purchases and products.</p></div></div><div id="reportRows"></div></section><p class="poc-note">CSV export contains only employee number, name and total for the selected week or month.</p></main></div></body></html>
